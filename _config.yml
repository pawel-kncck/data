# Site settings for GitHub Pages (Jekyll) using the just-the-docs remote theme.
# Docs: https://just-the-docs.com/

title: Data Learning Program
description: A personal, self-paced program to learn databases, data engineering and data analytics.

# The site is served at https://<user>.github.io/data/ — keep baseurl in sync with the repo name.
url: "https://pawel-kncck.github.io"
baseurl: "/data"

remote_theme: just-the-docs/just-the-docs

plugins:
  - jekyll-remote-theme
  - jekyll-relative-links   # lets plain `[text](path.md)` links work on the site and on GitHub

relative_links:
  enabled: true
  collections: false

# Theme options
color_scheme: light
search_enabled: true
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"
enable_copy_code_button: true

aux_links:
  "Repository on GitHub":
    - "https://github.com/pawel-kncck/data"
aux_links_new_tab: true

footer_content: "Personal learning program · v0.1 · Built with Jekyll and just-the-docs."

callouts_level: quiet
callouts:
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green
  warning:
    title: Warning
    color: yellow
  important:
    title: Important
    color: red

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  - node_modules/
  - .jekyll-cache/
